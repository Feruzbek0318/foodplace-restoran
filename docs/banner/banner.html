<!doctype html>
<!-- Source of docs/banner.jpg and docs/social-preview.png (1280×640).
     Re-render: see the README section "Banner". -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --blue: #2563EB; --blue2: #3B82F6; --text: #F8FAFC; --muted: #94A3B8; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text);
    background:
      radial-gradient(700px 520px at 930px 330px, rgba(37,99,235,.38), transparent 70%),
      radial-gradient(420px 360px at 60px 620px, rgba(16,185,129,.12), transparent 70%),
      linear-gradient(135deg, #0F172A 0%, #0B1120 100%);
    position: relative;
  }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(148,163,184,.06) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(148,163,184,.06) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(600px 500px at 900px 320px, #000 30%, transparent 80%); }

  .left { position: absolute; left: 68px; top: 0; bottom: 0; width: 540px;
          display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .logo { width: 84px; height: 84px; border-radius: 24px; background: linear-gradient(160deg, var(--blue2), var(--blue));
          display: flex; align-items: center; justify-content: center;
          box-shadow: 0 14px 36px rgba(37,99,235,.5); }
  .logo svg { width: 48px; height: 48px; }
  .brand h1 { font-size: 78px; font-weight: 800; letter-spacing: -2.5px; line-height: 1; }
  .tagline { margin-top: 22px; font-size: 36px; font-weight: 800; color: #60A5FA; letter-spacing: -.5px; }
  .sub { margin-top: 12px; font-size: 21px; font-weight: 500; color: var(--muted); line-height: 1.45; }

  .chips { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 9px; max-width: 520px; }
  .chip { padding: 8px 14px; border-radius: 999px; font-size: 16px; font-weight: 700;
          background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); }
  .chip b { color: #60A5FA; margin-right: 6px; }

  .meta { margin-top: 28px; display: flex; gap: 24px; font-size: 17px; font-weight: 600; color: var(--muted); }
  .meta span { display: flex; align-items: center; gap: 8px; }
  .meta i { width: 8px; height: 8px; border-radius: 50%; background: #10B981; display: inline-block; }

  .win { position: absolute; border-radius: 14px; overflow: hidden; background: #fff;
         border: 1px solid rgba(255,255,255,.18); box-shadow: 0 30px 70px rgba(0,0,0,.6); }
  .bar { height: 26px; background: #E2E8F0; display: flex; align-items: center; gap: 6px; padding: 0 10px; }
  .bar i { width: 9px; height: 9px; border-radius: 50%; display: block; }
  .bar .url { margin-left: 10px; height: 14px; flex: 1; max-width: 220px; border-radius: 7px; background: #fff; }
  .win img { display: block; width: 100%; }
  .w1 { width: 540px; left: 700px; top: 40px; transform: rotate(2deg); opacity: .85; }
  .w2 { width: 540px; left: 612px; top: 170px; z-index: 3;
        box-shadow: 0 40px 90px rgba(0,0,0,.65), 0 0 70px rgba(37,99,235,.35); }
  .w3 { width: 400px; left: 850px; top: 352px; z-index: 4; transform: rotate(-1.5deg);
        box-shadow: 0 30px 70px rgba(0,0,0,.7); }
  .ru { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="left">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.041V20a1 1 0 0 0 1 1Z"/>
          <path d="M6 17h12"/>
        </svg>
      </div>
      <h1>FoodPlace</h1>
    </div>
    <div class="tagline">Restoran boshqaruv tizimi</div>
    <div class="sub">Kassa, oshxona, stollar, ombor va moliya —<br>restoran va kafe uchun bitta panelda.</div>
    <div class="chips">
      <div class="chip"><b>⊞</b>Kassa (POS)</div>
      <div class="chip"><b>◉</b>Oshxona (KDS)</div>
      <div class="chip"><b>▦</b>Stollar xaritasi</div>
      <div class="chip"><b>▤</b>Omborxona</div>
      <div class="chip"><b>↗</b>Moliya hisoboti</div>
    </div>
    <div class="meta">
      <span><i></i>Brauzer · Windows</span>
      <span><i></i>O'zbek · <span class="ru">Русский</span> · English</span>
    </div>
  </div>

  <div class="win w1"><div class="bar"><i style="background:#F87171"></i><i style="background:#FBBF24"></i><i style="background:#34D399"></i><div class="url"></div></div><img src="../screenshots/03-bosh-sahifa.jpg" alt=""></div>
  <div class="win w2"><div class="bar"><i style="background:#F87171"></i><i style="background:#FBBF24"></i><i style="background:#34D399"></i><div class="url"></div></div><img src="../screenshots/04-kassa-pos.jpg" alt=""></div>
  <div class="win w3"><div class="bar"><i style="background:#F87171"></i><i style="background:#FBBF24"></i><i style="background:#34D399"></i><div class="url"></div></div><img src="../screenshots/06-oshxona-kds.jpg" alt=""></div>
</body>
</html>
